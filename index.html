<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>For You ❤️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: 15px;
      text-align: center;
    }


    .card {
      background: white;
      padding: 30px;
      border-radius: 22px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.25);
      width: 100%;
      max-width: 380px;
      position: relative;
      z-index: 5;
    }

  
    video {
      width: 130px;
      height: 130px;
      object-fit: cover;
      border-radius: 18px;
      margin-bottom: 15px;
    }

    h2 {
      min-height: 65px;
      font-weight: 500;
      font-size: 18px;
    }

    button {
      padding: 10px 18px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
      margin: 6px;
    }

    #playBtn {
      background: #ff4d6d;
      color: white;
    }

    #yes {
      background: #ff4d6d;
      color: white;
    }

    #no {
      background: #333;
      color: white;
      position: absolute;
    }


    .heart {
      position: absolute;
      animation: floatUp 4s linear infinite;
      opacity: 0.8;
      pointer-events: none;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0);
        opacity: 1;
      }
      100% {
        transform: translateY(-100vh);
        opacity: 0;
      }
    }


    @media (max-width: 500px) {
      .card {
        padding: 22px;
      }

      video {
        width: 100px;
        height: 100px;
      }

      h2 {
        font-size: 16px;
      }

      button {
        font-size: 14px;
        padding: 8px 14px;
      }
    }
  </style>
</head>

<body>


  <audio id="music" src="./audio/Edd_Sheeran_-_Perfect_(mp3.pm).mp3" loop></audio>

  <div class="card">

    <video autoplay muted loop>
      <source src="./video/WhatsApp Video 2026-02-02 at 19.07.37.mp4" type="video/mp4">
    </video>

    <h2 id="message"></h2>

    <button id="playBtn">▶ Play Music ❤️</button>

    <div id="question" style="display:none;">
      <h3>Will you be my Valentine? 💘</h3>
      <button id="yes">Yes ❤️</button>
      <button id="no">No 😅</button>
    </div>

  </div>

  <script>
    const playBtn = document.getElementById("playBtn");
    const music = document.getElementById("music");
    const message = document.getElementById("message");
    const question = document.getElementById("question");
    const yesBtn = document.getElementById("yes");
    const noBtn = document.getElementById("no");


    playBtn.onclick = () => {
      music.play();
      playBtn.style.display = "none";
      startTyping();
      createHearts();
    };


    const text =
      "Hey... I've been meaning to tell you something ❤️ You make my days brighter and I really like you...";

    function startTyping() {
      let i = 0;

      function type() {
        if (i < text.length) {
          message.innerHTML += text.charAt(i);
          i++;
          setTimeout(type, 40);
        } else {
          question.style.display = "block";
        }
      }

      type();
    }

    function createHearts() {
      setInterval(() => {
        const heart = document.createElement("div");
        heart.innerHTML = "❤️";
        heart.className = "heart";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = Math.random() * 20 + 16 + "px";
        document.body.appendChild(heart);

        setTimeout(() => heart.remove(), 4000);
      }, 300);
    }

    /* RUN AWAY NO BUTTON */
    noBtn.addEventListener("mouseover", () => {
      const x = Math.random() * (window.innerWidth - 120);
      const y = Math.random() * (window.innerHeight - 60);

      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    });


    yesBtn.onclick = () => {
      document.body.innerHTML = `
        <div style="
          height:100vh;
          display:flex;
          justify-content:center;
          align-items:center;
          flex-direction:column;
          font-family:sans-serif;
          background:linear-gradient(135deg,#ff9a9e,#fad0c4);
        ">
          <h1>Yayyyy ❤️🥰</h1>
          <h2>You just made me the happiest person 💕</h2>
        </div>
      `;
    };
  </script>

</body>
</html>
